<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050008">
<title>ABOUT BAYU</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
    --purple: #a020ff;
    --purple-light: #d8a4ff;
    --white: #ffffff;
    --green: #43ff92;
    --bg: #050008;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    color: white;
    background: var(--bg);
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
}

button {
    font: inherit;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: #050008;
    overflow: hidden;
}

.background::before {
    content: "";
    position: absolute;
    inset: -40px 0 0;
    background-image:
        linear-gradient(
            to right,
            rgba(160,32,255,.18) 1px,
            transparent 1px
        ),
        linear-gradient(
            to bottom,
            rgba(160,32,255,.18) 1px,
            transparent 1px
        );
    background-size: 32px 32px;
    animation: gridMove 3s linear infinite;
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 0%,
            rgba(128,0,255,.17),
            transparent 65%);
}

@keyframes gridMove {
    to {
        background-position: 0 32px, 0 32px;
    }
}

/* HEADER */

header {
    min-height: 125px;
    padding: 58px 55px 25px;
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
}

.title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2.4vw, 25px);
    white-space: nowrap;
}

.word {
    position: relative;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(14px, 4.2vw, 42px);
    font-weight: 900;
    opacity: .3;
    color: var(--purple);
    filter: blur(3px);
    transition: .4s ease;
}

.word.active {
    opacity: 1;
    filter: blur(0);
    color: white;
    text-shadow:
        0 0 6px white,
        0 0 15px var(--purple),
        0 0 30px var(--purple);
}

.word.active::before,
.word.active::after {
    content: "";
    position: absolute;
    inset: -8px -6px;
    pointer-events: none;
}

.word.active::before {
    background:
        linear-gradient(white,white) left top/12px 2px no-repeat,
        linear-gradient(white,white) left top/2px 12px no-repeat,
        linear-gradient(white,white) right top/12px 2px no-repeat,
        linear-gradient(white,white) right top/2px 12px no-repeat;
}

.word.active::after {
    background:
        linear-gradient(white,white) left bottom/12px 2px no-repeat,
        linear-gradient(white,white) left bottom/2px 12px no-repeat,
        linear-gradient(white,white) right bottom/12px 2px no-repeat,
        linear-gradient(white,white) right bottom/2px 12px no-repeat;
}

/* TOMBOL MUSIK */

.music-toggle {
    position: absolute;
    right: 18px;
    top: 13px;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 1px solid var(--purple);
    border-radius: 7px;
    color: white;
    background: rgba(128,0,255,.22);
    box-shadow: 0 0 13px rgba(160,32,255,.3);
    cursor: pointer;
    transition: .25s;
}

.music-toggle svg {
    width: 22px;
    height: 22px;
}

.music-toggle.playing {
    background: #8000ff;
    box-shadow: 0 0 20px var(--purple);
}

.music-toggle:active {
    transform: scale(.9);
}

/* HALAMAN PERTAMA */

#home-page {
    position: relative;
    z-index: 1;
    animation: pageIn .6s ease both;
}

.profile-section {
    width: min(1000px, 90%);
    margin: 15px auto 35px;
    display: grid;
    grid-template-columns: 250px 1fr;
    align-items: center;
    gap: 38px;
}

.photo-frame {
    position: relative;
    aspect-ratio: 3 / 4;
    padding: 5px;
    background: rgba(160,32,255,.08);
    box-shadow: 0 0 25px rgba(160,32,255,.15);
}

.photo-frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #10051a;
}

.corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border-color: var(--purple);
    border-style: solid;
    filter: drop-shadow(0 0 5px var(--purple));
    z-index: 2;
}

.top-left {
    top: -5px;
    left: -5px;
    border-width: 3px 0 0 3px;
}

.top-right {
    top: -5px;
    right: -5px;
    border-width: 3px 3px 0 0;
}

.bottom-left {
    bottom: -5px;
    left: -5px;
    border-width: 0 0 3px 3px;
}

.bottom-right {
    bottom: -5px;
    right: -5px;
    border-width: 0 3px 3px 0;
}

.profile-info {
    min-width: 0;
}

.small-label {
    color: var(--purple-light);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 13px;
}

.profile-info h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 3.5vw, 35px);
    line-height: 1.4;
    overflow-wrap: anywhere;
    text-shadow: 0 0 15px rgba(160,32,255,.3);
}

.profile-description {
    margin-top: 16px;
    font-size: 18px;
    line-height: 1.85;
    color: #d8cce2;
    white-space: pre-line;
}

.purple-line {
    height: 2px;
    width: 75px;
    margin: 20px 0;
    background: var(--purple);
    box-shadow: 0 0 12px var(--purple);
}

/* JUDUL KARTU */

.interest-heading {
    width: min(1000px, 90%);
    margin: 15px auto 20px;
}

.interest-heading h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(16px, 3vw, 23px);
    letter-spacing: 2px;
}

.interest-heading p {
    color: #a99bb5;
    margin-top: 5px;
    font-size: 16px;
}

/* EMPAT KARTU TRANSPARAN */

.interest-list {
    width: min(1000px, 90%);
    margin: 0 auto 75px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.interest-card {
    --accent: var(--purple);

    width: 100%;
    min-height: 110px;
    padding: 17px;
    display: flex;
    align-items: center;
    gap: 17px;
    text-align: left;

    color: white;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(200,150,255,.19);
    border-radius: 17px;

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    cursor: pointer;
    position: relative;
    overflow: hidden;

    opacity: 0;
    transform: translateY(30px) scale(.97);

    transition:
        opacity .7s ease,
        transform .7s cubic-bezier(.2,.7,.2,1),
        border-color .3s ease,
        background .3s ease,
        box-shadow .3s ease;
}

.interest-card.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.interest-card:hover {
    border-color: var(--accent);
    background: rgba(130,40,190,.10);
    box-shadow: 0 0 22px rgba(160,32,255,.12);
}

.interest-card:active {
    transform: scale(.97);
}

.interest-card::before {
    content: "";
    position: absolute;
    width: 130px;
    height: 130px;
    right: -70px;
    top: -70px;
    background: var(--accent);
    opacity: .09;
    filter: blur(40px);
    pointer-events: none;
}

.icon-box {
    flex: 0 0 65px;
    width: 65px;
    height: 65px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,.17);
    border-radius: 13px;
    background: rgba(160,32,255,.20);
    box-shadow:
        inset 0 0 14px rgba(160,32,255,.12),
        0 0 14px rgba(160,32,255,.10);
    color: white;
}

.icon-box svg {
    width: 34px;
    height: 34px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 5px currentColor);
}

.interest-card[data-id="volley"] {
    --accent: var(--green);
}

.interest-card[data-id="volley"] .icon-box {
    color: var(--green);
    background: rgba(67,255,146,.12);
    box-shadow: 0 0 18px rgba(67,255,146,.14);
}

.card-text {
    flex: 1;
    min-width: 0;
}

.card-text small {
    display: block;
    color: #bcaacb;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.card-text strong {
    display: block;
    font-size: 23px;
    font-weight: 700;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

.card-arrow {
    color: var(--purple-light);
    font-size: 25px;
    margin-left: auto;
}

/* HALAMAN DETAIL */

#detail-page {
    position: relative;
    z-index: 2;
    width: min(850px, 90%);
    margin: 0 auto 70px;
    display: none;
}

#detail-page.open {
    display: block;
    animation: pageIn .55s ease both;
}

.back-button {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 17px;
    margin: 8px 0 22px;

    color: white;
    border: 1px solid rgba(190,120,255,.55);
    border-radius: 10px;
    background: rgba(160,32,255,.13);
    cursor: pointer;
    transition: .25s;
}

.back-button:hover {
    background: rgba(160,32,255,.3);
    box-shadow: 0 0 18px rgba(160,32,255,.2);
}

.back-button svg {
    width: 19px;
    height: 19px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
}

.detail-panel {
    padding: clamp(17px, 4vw, 32px);
    border: 1px solid rgba(200,150,255,.23);
    border-radius: 20px;
    background: rgba(255,255,255,.045);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 0 35px rgba(110,0,200,.10);
}

.detail-heading {
    display: flex;
    align-items: center;
    gap: 17px;
    margin-bottom: 22px;
}

.detail-icon {
    width: 65px;
    height: 65px;
    flex: 0 0 65px;
    display: grid;
    place-items: center;
    border: 1px solid var(--purple);
    border-radius: 14px;
    color: white;
    background: rgba(128,0,255,.23);
    box-shadow: 0 0 18px rgba(160,32,255,.18);
}

.detail-icon svg {
    width: 34px;
    height: 34px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 5px var(--purple));
}

.detail-heading small {
    color: var(--purple-light);
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
}

.detail-heading h1 {
    margin-top: 6px;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(21px, 4vw, 33px);
    overflow-wrap: anywhere;
}

.detail-image-frame {
    position: relative;
    width: 100%;
    height: clamp(190px, 40vw, 330px);
    margin-bottom: 23px;
    overflow: hidden;
    border-radius: 13px;
    background:
        radial-gradient(circle at center,
            rgba(160,32,255,.20),
            transparent 70%),
        #100719;
    border: 1px solid rgba(160,32,255,.35);
}

.detail-image-frame img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

.detail-image-frame img:not([src]),
.detail-image-frame img[src=""] {
    display: none;
}

.detail-image-frame.no-image::after {
    content: "DETAIL";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(216,164,255,.45);
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    letter-spacing: 7px;
    pointer-events: none;
}

.detail-description {
    color: #e1d5eb;
    font-size: 18px;
    line-height: 1.9;
    white-space: pre-line;
    overflow-wrap: anywhere;
}

.detail-subtitle {
    color: var(--purple-light);
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    margin: 22px 0 10px;
}

/* EFEK GLITCH / VIRUS VISUAL */

body.glitching::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 4px,
            rgba(160,32,255,.09) 5px,
            transparent 7px
        );
    animation: glitchFlash .28s steps(2) both;
}

@keyframes glitchFlash {
    0% {
        opacity: 0;
        transform: translateX(-4px);
    }
    35% {
        opacity: .8;
        transform: translateX(3px);
    }
    70% {
        opacity: .3;
        transform: translateX(-2px);
    }
    100% {
        opacity: 0;
        transform: translateX(0);
    }
}

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateY(16px);
        filter: blur(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

/* RESPONSIVE */

@media (max-width: 650px) {
    header {
        min-height: 103px;
        padding: 48px 10px 22px;
    }

    .title {
        gap: 8px;
    }

    .word {
        font-size: clamp(11px, 3.7vw, 22px);
        letter-spacing: 0;
    }

    .music-toggle {
        top: 8px;
        right: 12px;
        width: 33px;
        height: 33px;
    }

    .music-toggle svg {
        width: 19px;
        height: 19px;
    }

    .profile-section {
        grid-template-columns: 1fr;
        gap: 28px;
        width: 88%;
        margin-top: 12px;
    }

    .photo-frame {
        width: min(230px, 75%);
        margin: 0 auto;
    }

    .profile-info {
        text-align: center;
    }

    .profile-description {
        text-align: left;
        font-size: 17px;
    }

    .profile-info .purple-line {
        margin-left: auto;
        margin-right: auto;
    }

    .interest-list {
        grid-template-columns: 1fr;
        gap: 13px;
    }

    .interest-card {
        min-height: 94px;
        padding: 13px;
        gap: 13px;
    }

    .icon-box {
        width: 56px;
        height: 56px;
        flex-basis: 56px;
    }

    .icon-box svg {
        width: 30px;
        height: 30px;
    }

    .card-text strong {
        font-size: 21px;
    }

    #detail-page {
        width: 90%;
    }

    .detail-description {
        font-size: 17px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

/* =====================================
   ISI PROFIL
===================================== */

document.getElementById("profile-photo").src = CONFIG.photo;
document.getElementById("profile-label").textContent = CONFIG.profile.label;
document.getElementById("profile-name").textContent = CONFIG.profile.name;
document.getElementById("profile-description").textContent = CONFIG.profile.description;
document.getElementById("profile-footer").textContent = CONFIG.profile.footer;

/* =====================================
   JUDUL BERGANTIAN
===================================== */

const titleContainer = document.getElementById("page-title");

CONFIG.title.forEach((text, index) => {
    const word = document.createElement("span");
    word.className = "word";
    word.textContent = text;

    if (index === 0) word.classList.add("active");

    titleContainer.appendChild(word);
});

const words = document.querySelectorAll(".word");
let activeWord = 0;

setInterval(() => {
    words.forEach((word, index) => {
        word.classList.toggle("active", index === activeWord);
    });

    activeWord = (activeWord + 1) % words.length;
}, Math.max(200, Number(CONFIG.spotlightSpeed) || 1300));

/* =====================================
   KARTU INTERAKTIF
===================================== */

const interestList = document.getElementById("interest-list");
const homePage = document.getElementById("home-page");
const detailPage = document.getElementById("detail-page");

const iconMarkup = (iconId) =>
    `<svg viewBox="0 0 48 48" aria-hidden="true"><use href="#${iconId}"></use></svg>`;

const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
        if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
        }
    });
}, {
    threshold: 0.12
});

CONFIG.interests.forEach((item, index) => {
    const card = document.createElement("button");

    card.type = "button";
    card.className = "interest-card";
    card.dataset.id = item.id;
    card.style.transitionDelay = `${index * 100}ms`;

    card.innerHTML = `
        <span class="icon-box">${iconMarkup(item.icon)}</span>
        <span class="card-text">
            <small>${item.label}</small>
            <strong>${item.title}</strong>
        </span>
        <span class="card-arrow" aria-hidden="true">›</span>
    `;

    card.addEventListener("click", () => openDetail(item));

    interestList.appendChild(card);
    observer.observe(card);
});

/* =====================================
   EFEK GLITCH SINGKAT
===================================== */

let glitchTimer;

function playGlitchEffect() {
    document.body.classList.remove("glitching");

    // Memicu ulang animasi tanpa library tambahan.
    void document.body.offsetWidth;

    document.body.classList.add("glitching");

    clearTimeout(glitchTimer);
    glitchTimer = setTimeout(() => {
        document.body.classList.remove("glitching");
    }, 300);
}

/* =====================================
   BUKA HALAMAN DETAIL
===================================== */

function openDetail(item) {
    playGlitchEffect();

    document.getElementById("detail-icon").innerHTML =
        iconMarkup(item.icon);

    document.getElementById("detail-label").textContent = item.label;
    document.getElementById("detail-title").textContent = item.title;
    document.getElementById("detail-description").textContent =
        item.description;
    document.getElementById("detail-extra").textContent = item.extra;

    const image = document.getElementById("detail-image");
    const imageFrame = document.getElementById("detail-image-frame");

    image.onload = () => {
        image.hidden = false;
        imageFrame.classList.remove("no-image");
    };

    image.onerror = () => {
        image.hidden = true;
        image.removeAttribute("src");
        imageFrame.classList.add("no-image");
    };

    image.hidden = true;
    image.removeAttribute("src");
    imageFrame.classList.add("no-image");

    if (item.image) {
        image.src = item.image;
    }

    homePage.style.display = "none";
    detailPage.classList.add("open");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

/* =====================================
   KEMBALI KE HALAMAN UTAMA
===================================== */

document.getElementById("back-button").addEventListener("click", () => {
    playGlitchEffect();

    detailPage.classList.remove("open");
    homePage.style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

/* =====================================
   MUSIK OTOMATIS + ON/OFF
===================================== */

const audio = document.getElementById("background-music");
const musicButton = document.getElementById("music-toggle");

audio.src = CONFIG.music.url;
audio.volume = Math.min(1, Math.max(0, Number(CONFIG.music.volume) || 0.7));

function updateMusicButton(isPlaying) {
    musicButton.classList.toggle("playing", isPlaying);

    musicButton.setAttribute("aria-pressed", String(isPlaying));

    musicButton.setAttribute(
        "aria-label",
        isPlaying ? "Matikan musik" : "Hidupkan musik"
    );
}

musicButton.addEventListener("click", async () => {
    if (!audio.paused) {
        audio.pause();
        updateMusicButton(false);
        return;
    }

    try {
        await audio.play();
        updateMusicButton(true);
    } catch (error) {
        updateMusicButton(false);
        alert("Musik gagal diputar. Periksa URL audio.");
    }
});

audio.addEventListener("play", () => updateMusicButton(true));
audio.addEventListener("pause", () => updateMusicButton(false));

/* COBA PUTAR LANGSUNG SAAT HALAMAN DIBUKA */

async function tryAutoplay() {
    if (!CONFIG.music.autoplay || !CONFIG.music.url) return;

    try {
        await audio.play();
        updateMusicButton(true);
    } catch (error) {
        // Autoplay bersuara mungkin diblokir oleh browser.
        // Tombol musik tetap tersedia untuk memulai audio.
        updateMusicButton(false);
    }
}

tryAutoplay();
</script>
